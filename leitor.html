<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário - Leitor</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #e2e8f0; display: flex; justify-content: center; padding: 12px; }
        
        .container {
            width: 100%;
            max-width: 440px;
            background-color: #fff;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }
        
        .header-box {
            background: linear-gradient(135deg, #1f385c 0%, #0f172a 100%);
            border-radius: 14px;
            padding: 14px 16px;
            text-align: center;
            color: #fff;
            box-shadow: 0 4px 12px rgba(31, 56, 92, 0.25);
        }
        .header-box h2 { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.5px; }

        #reader {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #1f385c;
            background-color: #000;
        }
        
        .result-box {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 1.05rem;
            font-weight: 600;
        }
        
        .summary-box {
            border-top: 2px dashed #cbd5e1;
            padding-top: 8px;
        }
        .summary-title {
            font-weight: 800;
            font-size: 1.1rem;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            margin-bottom: 6px;
            background-color: #f1f5f9;
            padding: 8px 12px;
            border-radius: 10px;
        }
        .empty-info { font-size: 1rem; color: #64748b; font-style: italic; }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn:active { transform: scale(0.98); }

        .btn-list { background-color: #0284c7; color: #fff; }
        .btn-finish { background-color: #16a34a; color: #fff; }

        /* Modais */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }
        .modal-body {
            background: #fff;
            padding: 22px 18px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            border: 3px solid #1f385c;
        }
        .modal-body h3 { font-size: 1.3rem; font-weight: 800; color: #1f385c; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .modal-body label { font-size: 1.05rem; font-weight: 700; color: #334155; }
        .modal-body input { width: 100%; padding: 13px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1.1rem; font-weight: 600; margin-top: 4px; }
        
        .item-info-card { background-color: #f8fafc; border: 2px solid #1f385c; border-radius: 12px; padding: 12px; font-size: 1.1rem; line-height: 1.5; }

        .btn-confirm { background-color: #16a34a; color: #fff; }
        .btn-cancel { background-color: #dc2626; color: #fff; }
        .btn-save { background-color: #1f385c; color: #fff; }

        /* Lista Completa */
        .full-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
            overflow-y: auto;
        }
        .list-card {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }
        .list-card-bipado {
            background-color: #dcfce7;
            border: 2px solid #16a34a;
            color: #14532d;
        }
        .list-card-zerado {
            background-color: #fee2e2;
            border: 2px solid #ef4444;
            color: #7f1d1d;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header-box">
            <h2 id="sector-title">SETOR</h2>
        </header>

        <div id="reader"></div>

        <div class="result-box" id="result">
            <p><strong>Status:</strong> Aguardando leitura...</p>
        </div>

        <div class="summary-box">
            <div class="summary-title">Últimas 3 peças bipadas:</div>
            <div id="items-list"></div>
        </div>

        <button onclick="abrirModalLista()" class="btn btn-list">📋 VER LISTA COMPLETA</button>
        <button onclick="abrirModalFinalizar()" class="btn btn-finish">✅ FINALIZAR INVENTÁRIO</button>
    </div>

    <!-- Modal: Confirmação do Item Bipado -->
    <div class="modal-overlay" id="modal-confirmar-bip">
        <div class="modal-body">
            <h3>Confirmar Item Bipado</h3>
            <div id="dados-item-bipado" class="item-info-card"></div>
            <button onclick="confirmarSomaItem()" class="btn btn-confirm">CONFIRMAR E SOMAR (+1)</button>
            <button onclick="cancelarBip()" class="btn btn-cancel">CANCELAR</button>
        </div>
    </div>

    <!-- Modal: Lista Completa de Materiais -->
    <div class="modal-overlay" id="modal-lista-completa">
        <div class="modal-body">
            <h3>Lista de Materiais</h3>
            <input type="text" id="inputBuscaLista" placeholder="🔍 Pesquisar código ou descrição..." oninput="filtrarListaCompleta()">
            <div id="container-lista-completa" class="full-list-container"></div>
            <button onclick="fecharModalLista()" class="btn btn-cancel">FECHAR</button>
        </div>
    </div>

    <!-- Modal: Finalização -->
    <div class="modal-overlay" id="modal-finalizar">
        <div class="modal-body">
            <h3>Responsáveis</h3>
            <div>
                <label>Colaborador-GPS:</label>
                <input type="text" id="colabGps" placeholder="Nome do colaborador GPS">
            </div>
            <div>
                <label>Colaborador-Manutenção:</label>
                <input type="text" id="colabManutencao" placeholder="Nome do colaborador Manutenção">
            </div>
            <button onclick="salvarEGerarExcel()" class="btn btn-save">SALVAR E GERAR EXCEL</button>
            <button onclick="fecharModalFinalizar()" class="btn btn-cancel">VOLTAR</button>
        </div>
    </div>

    <script>
        const setor = localStorage.getItem('setorAtivo') || 'GERAL';
        let dadosInventario = JSON.parse(localStorage.getItem('dadosInventario')) || [];
        let ultimosBipados = JSON.parse(localStorage.getItem('ultimosBipados')) || [];
        
        let itemPendente = null;
        let html5QrCode = null;

        document.getElementById('sector-title').innerText = `SETOR ${setor}`;

        function atualizarTabelaUI() {
            const listContainer = document.getElementById('items-list');
            listContainer.innerHTML = '';

            if (ultimosBipados.length === 0) {
                listContainer.innerHTML = '<p class="empty-info">Nenhuma peça bipada até o momento.</p>';
                return;
            }

            const ultimos3 = ultimosBipados.slice(0, 3);

            ultimos3.forEach(yg => {
                const item = dadosInventario.find(i => i.yg === yg);
                if (item) {
                    listContainer.innerHTML += `
                        <div class="item-row">
                            <span><strong>Seq ${item.seq}</strong> - ${item.desc}<br><small style="color:#475569">Cód: ${item.yg}</small></span>
                            <span style="font-size: 1.15rem; font-weight:800;">Qtd: ${item.qtd}</span>
                        </div>
                    `;
                }
            });
        }

        function iniciarCameraTraseira() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 280, height: 160 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                () => {}
            ).catch(err => {
                console.error("Erro ao abrir a câmera traseira:", err);
                alert("Erro ao acessar a câmera traseira. Verifique as permissões do navegador.");
            });
        }

        function onScanSuccess(decodedText) {
            const item = dadosInventario.find(i => i.yg === decodedText);
            const resultDiv = document.getElementById('result');

            if (item) {
                html5QrCode.pause();
                itemPendente = item;

                document.getElementById('dados-item-bipado').innerHTML = `
                    <p><strong>Sequência (SEQ):</strong> ${item.seq}</p>
                    <p><strong>Código (YG):</strong> ${item.yg}</p>
                    <p><strong>Descrição:</strong> ${item.desc}</p>
                    <p><strong>Quantidade Atual:</strong> ${item.qtd}</p>
                `;
                document.getElementById('modal-confirmar-bip').style.display = 'flex';
            } else {
                resultDiv.innerHTML = `
                    <p style="color: #dc2626;"><strong>✖ Código Não Encontrado!</strong></p>
                    <p><strong>Código Lido:</strong> ${decodedText}</p>
                `;
            }
        }

        function confirmarSomaItem() {
            if (itemPendente) {
                itemPendente.qtd += 1;
                
                ultimosBipados.unshift(itemPendente.yg);
                if (ultimosBipados.length > 3) {
                    ultimosBipados = ultimosBipados.slice(0, 3);
                }

                localStorage.setItem('dadosInventario', JSON.stringify(dadosInventario));
                localStorage.setItem('ultimosBipados', JSON.stringify(ultimosBipados));

                atualizarTabelaUI();

                document.getElementById('result').innerHTML = `
                    <p style="color: #16a34a;"><strong>✔ Contagem Atualizada!</strong></p>
                    <p><strong>Item:</strong> ${itemPendente.desc}</p>
                    <p><strong>Total Bipado:</strong> ${itemPendente.qtd}</p>
                `;
            }
            fecharModalConfirmacao();
        }

        function cancelarBip() {
            document.getElementById('result').innerHTML = `
                <p style="color: #64748b;"><strong>Leitura cancelada pelo usuário.</strong></p>
            `;
            fecharModalConfirmacao();
        }

        function fecharModalConfirmacao() {
            itemPendente = null;
            document.getElementById('modal-confirmar-bip').style.display = 'none';
            html5QrCode.resume();
        }

        function abrirModalLista() {
            renderizarListaCompleta(dadosInventario);
            document.getElementById('modal-lista-completa').style.display = 'flex';
        }

        function fecharModalLista() {
            document.getElementById('modal-lista-completa').style.display = 'none';
            document.getElementById('inputBuscaLista').value = '';
        }

        function renderizarListaCompleta(lista) {
            const container = document.getElementById('container-lista-completa');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p class="empty-info">Nenhum item encontrado.</p>';
                return;
            }

            lista.forEach(item => {
                const classeCor = item.qtd > 0 ? 'list-card-bipado' : 'list-card-zerado';
                container.innerHTML += `
                    <div class="list-card ${classeCor}">
                        <div>
                            <div>${item.seq}. ${item.desc}</div>
                            <small style="opacity: 0.8">Cód: ${item.yg}</small>
                        </div>
                        <div style="font-size:1.15rem;">Qtd: ${item.qtd}</div>
                    </div>
                `;
            });
        }

        function filtrarListaCompleta() {
            const termo = document.getElementById('inputBuscaLista').value.toLowerCase();
            const filtrados = dadosInventario.filter(item => 
                item.desc.toLowerCase().includes(termo) || 
                item.yg.toLowerCase().includes(termo) ||
                item.seq.toString().includes(termo)
            );
            renderizarListaCompleta(filtrados);
        }

        function abrirModalFinalizar() {
            document.getElementById('modal-finalizar').style.display = 'flex';
        }

        function fecharModalFinalizar() {
            document.getElementById('modal-finalizar').style.display = 'none';
        }

        function salvarEGerarExcel() {
            const colabGps = document.getElementById('colabGps').value.trim();
            const colabManut = document.getElementById('colabManutencao').value.trim();

            if (!colabGps || !colabManut) {
                alert('Por favor, preencha o nome dos dois colaboradores.');
                return;
            }

            const hoje = new Date().toLocaleDateString('pt-BR');

            const wb = XLSX.utils.book_new();
            const wsData = [
                ["INVENTÁRIO FÍSICO DE MATERIAIS", ""],
                ["SETOR:", setor],
                ["DATA DE REALIZAÇÃO:", hoje],
                ["RESPONSÁVEL GPS:", colabGps],
                ["RESPONSÁVEL MANUTENÇÃO:", colabManut],
                [],
                ["SEQ", "SETOR", "CÓDIGO (YG)", "DESCRIÇÃO", "QUANTIDADE"]
            ];

            dadosInventario.forEach(item => {
                wsData.push([
                    item.seq,
                    item.setor,
                    item.yg,
                    item.desc,
                    item.qtd
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);

            const thinBorder = {
                top: { style: 'thin', color: { rgb: 'D3D3D3' } },
                bottom: { style: 'thin', color: { rgb: 'D3D3D3' } },
                left: { style: 'thin', color: { rgb: 'D3D3D3' } },
                right: { style: 'thin', color: { rgb: 'D3D3D3' } }
            };

            const headerTitleStyle = {
                font: { bold: true, color: { rgb: 'FFFFFF' }, size: 12 },
                fill: { fgColor: { rgb: '1F385C' } },
                alignment: { vertical: 'center' }
            };

            const metaLabelStyle = { font: { bold: true, color: { rgb: '1F385C' } } };

            const tableHeaderStyle = {
                font: { bold: true, color: { rgb: 'FFFFFF' }, size: 10 },
                fill: { fgColor: { rgb: '2D3748' } },
                alignment: { horizontal: 'center', vertical: 'center' },
                border: thinBorder
            };

            const cellStyleCenter = (isZebra) => ({
                alignment: { horizontal: 'center', vertical: 'center' },
                border: thinBorder,
                fill: { fgColor: { rgb: isZebra ? 'F7FAFC' : 'FFFFFF' } }
            });

            const cellStyleLeft = (isZebra) => ({
                alignment: { horizontal: 'left', vertical: 'center' },
                border: thinBorder,
                fill: { fgColor: { rgb: isZebra ? 'F7FAFC' : 'FFFFFF' } }
            });

            ws['A1'].s = headerTitleStyle;

            for (let r = 2; r <= 5; r++) {
                if (ws[`A${r}`]) ws[`A${r}`].s = metaLabelStyle;
            }

            const columns = ['A', 'B', 'C', 'D', 'E'];
            columns.forEach(col => {
                if (ws[`${col}7`]) ws[`${col}7`].s = tableHeaderStyle;
            });

            const startRow = 8;
            dadosInventario.forEach((_, idx) => {
                const rowNum = startRow + idx;
                const isZebra = idx % 2 === 1;

                if (ws[`A${rowNum}`]) ws[`A${rowNum}`].s = cellStyleCenter(isZebra);
                if (ws[`B${rowNum}`]) ws[`B${rowNum}`].s = cellStyleCenter(isZebra);
                if (ws[`C${rowNum}`]) ws[`C${rowNum}`].s = cellStyleCenter(isZebra);
                if (ws[`D${rowNum}`]) ws[`D${rowNum}`].s = cellStyleLeft(isZebra);
                if (ws[`E${rowNum}`]) ws[`E${rowNum}`].s = cellStyleCenter(isZebra);
            });

            ws['!cols'] = [
                { wch: 8 },
                { wch: 16 },
                { wch: 18 },
                { wch: 38 },
                { wch: 14 }
            ];

            XLSX.utils.book_append_sheet(wb, ws, "Inventário");

            const dataFormatada = new Date().toISOString().split('T')[0];
            const nomeArquivo = `inventario_${setor}_${dataFormatada}.xlsx`;
            XLSX.writeFile(wb, nomeArquivo);

            localStorage.removeItem('dadosInventario');
            localStorage.removeItem('ultimosBipados');
            document.getElementById('modal-finalizar').style.display = 'none';
            alert('Inventário Excel gerado e formatado com sucesso!');
            window.location.href = 'index.html';
        }

        atualizarTabelaUI();
        iniciarCameraTraseira();
    </script>
</body>
</html>
