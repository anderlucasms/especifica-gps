<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Inventário Específica GPS</title>
		
		<script src="https://unpkg.com/html5-qrcode"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
		<!-- Estilo CSS -->
		<link rel="stylesheet" type="text/css" href="estilo.css">
		<!-- JavaScript JS -->
		<script src="script.js" defer></script>

	</head>
	<body>
		<div class="container">
	        <header class="header-box">
	            <h1>ESPECIFICA - GPS</h1>
	        </header>

	        <nav class="nav-list">
	            <button onclick="selecionarSetor('MONTAGEM', listaMontagem)" class="btn-link btn-montagem">MONTAGEM</button>
	            <button onclick="selecionarSetor('PINTURA', listaPintura)" class="btn-link btn-pintura">PINTURA</button>
	            <button onclick="selecionarSetor('FUNILARIA', listaFunilaria)" class="btn-link btn-funilaria">FUNILARIA</button>
	            <button onclick="selecionarSetor('PRENSAS', listaPrensas)" class="btn-link btn-prensas">PRENSAS</button>
	        </nav>
	    </div>

	    <!-- Importação dos arquivos externos de listas -->
	    <script src="listas/montagem.js"></script>
	    <script src="listas/pintura.js"></script>
	    <script src="listas/funilaria.js"></script>
	    <script src="listas/prensas.js"></script>

	    <script>
	        function selecionarSetor(nomeSetor, listaDoSetor) {
	            // Inicializa a quantidade com 0 para todos os itens da lista
	            const listaComQtd = listaDoSetor.map(item => ({ ...item, qtd: 0 }));

	            // Salva o setor e os dados na memória (localStorage)
	            localStorage.setItem('setorAtivo', nomeSetor);
	            localStorage.setItem('dadosInventario', JSON.stringify(listaComQtd));

	            // Redireciona para o leitor
	            window.location.href = 'leitor.html';
	        }
	    </script>
	</body>
</html>
